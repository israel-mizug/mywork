<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Work</title>
<meta name="description" content="ניהול לקוחות ועבודות">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0B2F55">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Work">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --navy:#0B2F55;--navy2:#123F6F;--blue:#1476C6;--ice:#E8F3FB;--bg:#F2F6F9;--card:#fff;
  --text:#14263A;--muted:#5E7184;--line:#DCE5EC;
  --orange:#E8641B;--orange-soft:#FDEDE3;
  --red:#C2332A;--red-soft:#FBE8E6;--green:#167A4F;--green-soft:#E2F4EB;--amber:#A86A00;--amber-soft:#FCF2DC;
  --r:14px;--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Hebrew","Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
svg{display:block;flex:none}
bdi{unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:13.5px}.bold{font-weight:700}
.grow{flex:1;min-width:0}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{white-space:pre-wrap;overflow-wrap:anywhere}

/* app frame */
.hdr{background:var(--navy);color:#fff;padding:calc(var(--top) + 10px) 14px 12px}
.hdr .row img{width:36px;height:36px;border-radius:9px;object-fit:cover}
.hdr h1{font-size:19px;font-weight:700}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
main{padding:12px 14px calc(var(--bot) + 92px) 40px;max-width:760px;margin:0 auto}
.nav{position:fixed;inset:auto 0 0 0;z-index:20;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:var(--bot)}
.nav button{position:relative;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--muted)}
.nav button.on{color:var(--blue);font-weight:700}
.dot{position:absolute;top:5px;left:calc(50% - 20px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.handle{position:fixed;left:0;top:44%;z-index:15;width:32px;padding:12px 0;background:var(--orange);color:#fff;border-radius:0 12px 12px 0;display:flex;flex-direction:column;align-items:center;gap:7px;box-shadow:0 3px 10px rgba(11,47,85,.25)}
.handle span{writing-mode:vertical-rl;font-size:13px;font-weight:700;letter-spacing:.2px}
.handle b{min-width:20px;height:20px;border-radius:10px;background:#fff;color:var(--orange);font-size:12px;display:grid;place-items:center}
.fab{position:fixed;right:max(16px,calc(50vw - 364px));bottom:calc(var(--bot) + 72px);z-index:16;height:52px;padding:0 18px 0 20px;border-radius:26px;background:var(--blue);color:#fff;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 5px 16px rgba(20,118,198,.4)}

/* blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:9px}
.sec{margin-top:20px}
.sec>.row:first-child{margin-bottom:8px;min-height:32px}
.sec h2{font-size:16.5px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.tile{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 10px;min-width:0}
.tile b{display:block;font-size:19px;line-height:1.2}
.tile span{font-size:12.5px;color:var(--muted)}
.search{position:relative;margin-top:11px}
.search svg{position:absolute;right:12px;top:12px;color:var(--muted)}
.search input{width:100%;height:46px;border:0;border-radius:12px;padding:0 42px 0 12px;background:#fff;font-size:16px;outline:none}
.chips{display:flex;gap:7px;margin-bottom:11px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 13px;border-radius:18px;background:#fff;border:1px solid var(--line);font-size:14px;display:flex;align-items:center;color:var(--muted)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;font-size:12.5px;font-weight:700;white-space:nowrap}
.t-red{background:var(--red-soft);color:var(--red)}.t-green{background:var(--green-soft);color:var(--green)}
.t-amber{background:var(--amber-soft);color:var(--amber)}.t-blue{background:var(--ice);color:var(--blue)}.t-gray{background:#EDF1F4;color:var(--muted)}
.item{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;min-height:60px}
.item .ttl{font-weight:650}
.datebox{width:46px;flex:none;text-align:center;background:var(--ice);border-radius:10px;padding:5px 0;color:var(--navy);font-size:12px;line-height:1.2}
.datebox b{display:block;font-size:16px}
.avatar{width:40px;height:40px;flex:none;border-radius:50%;background:var(--ice);color:var(--navy);font-weight:700;display:grid;place-items:center}
.empty{text-align:center;color:var(--muted);padding:30px 16px;background:#fff;border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--text);margin-bottom:3px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:12px;background:var(--amber-soft);color:#6F4700;font-size:14px;margin-bottom:11px}
.linkbtn{color:var(--blue);font-weight:650;font-size:14.5px;min-height:32px;display:inline-flex;align-items:center;gap:3px}
.btn{height:46px;padding:0 15px;border-radius:12px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ice);color:var(--navy);text-align:center}
.btn.pri{background:var(--blue);color:#fff}.btn.ok{background:var(--green);color:#fff}.btn.bad{background:var(--red-soft);color:var(--red)}.btn.full{width:100%}
.btn.sm{height:36px;font-size:14px;padding:0 11px;border-radius:10px}
.btns{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.quick a,.quick .off{height:62px;border-radius:12px;background:var(--ice);color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:650}
.quick .off{opacity:.4}
.bal{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:13px;border-radius:var(--r);margin-top:12px}
.bal.red{background:var(--red-soft);color:var(--red)}.bal.green{background:var(--green-soft);color:var(--green)}
.bal b{font-size:21px;display:block;line-height:1.15}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
dl{margin:0}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos button{aspect-ratio:1;border-radius:10px;overflow:hidden;background:#DDE6ED}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos .add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:var(--ice);color:var(--blue);font-size:13px;font-weight:650}
.check{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid #AFC0CE;display:grid;place-items:center;color:#fff}
.check.on{background:var(--green);border-color:var(--green)}
.tick{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 4px 0 11px;min-height:50px}
.tick>button:first-of-type{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:8px 0 8px 0;min-height:48px}
.tick.done .txt{text-decoration:line-through;color:var(--muted)}
.mini{width:38px;height:44px;display:grid;place-items:center;color:var(--muted);flex:none}
.addline{display:flex;gap:7px;margin-bottom:9px}
.addline input,.addline textarea{flex:1;min-width:0}
.addline .btn{width:48px;padding:0;flex:none}

/* sheets */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;animation:up .2s ease-out}
.sheet.drawer{background:rgba(9,27,48,.45);animation:fade .15s}
.sheet.drawer .panel{position:absolute;inset:0 auto 0 0;width:min(92vw,430px);background:var(--bg);display:flex;flex-direction:column;animation:fromleft .2s ease-out;box-shadow:6px 0 24px rgba(0,0,0,.2)}
.sheet.dialog{background:rgba(9,27,48,.45);justify-content:flex-end;align-items:center;animation:fade .15s}
.sheet.dialog .panel{width:100%;max-width:520px;background:#fff;border-radius:18px 18px 0 0;padding:18px 16px calc(var(--bot) + 16px)}
.sheet.viewer{background:#000;color:#fff}
.viewer img{flex:1;min-height:0;width:100%;object-fit:contain}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes fromleft{from{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet .panel{animation:none!important}}
.bar{background:var(--navy);color:#fff;padding:calc(var(--top) + 4px) 6px 4px;display:flex;align-items:center;gap:2px;min-height:calc(var(--top) + 52px);flex:none}
.bar h2{flex:1;min-width:0;font-size:17.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(var(--bot) + 28px)}
.body>*{max-width:680px;margin-inline:auto}
.foot{flex:none;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(var(--bot) + 10px)}
.foot>*{max-width:680px;margin-inline:auto}

/* forms */
label.f{display:block;margin-bottom:13px}
label.f>span,.flabel{display:block;font-size:14px;font-weight:650;margin-bottom:5px;color:#35495D}
.inp,.f input,.f select,.f textarea,.addline input{width:100%;height:46px;border:1px solid #C9D6E0;border-radius:11px;background:#fff;padding:0 12px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.f input[type=date],.f input[type=time]{min-width:0;display:block}
.f textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical;display:block}
.f input:focus,.f select:focus,.f textarea:focus,.addline input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(20,118,198,.15)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px}
.pills input{position:absolute;opacity:0;pointer-events:none}
.pills span{display:flex;align-items:center;height:38px;padding:0 12px;border-radius:19px;background:#fff;border:1px solid #C9D6E0;font-size:14.5px}
.pills input:checked+span{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:650}
.pills input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#E2EAF0;border-radius:11px;padding:3px;margin-bottom:12px}
.seg button{height:44px;border-radius:9px;text-align:center;font-size:14px;line-height:1.15;color:var(--muted)}
.seg button.on{background:#fff;color:var(--navy);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 76px);max-width:88vw;width:max-content;background:#10263D;color:#fff;padding:10px 15px;border-radius:11px;font-size:14.5px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* entrance */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:calc(var(--top) + 20px) 24px calc(var(--bot) + 20px);color:#fff;background:radial-gradient(120vw 90vh at 50% 38%,#1B4F86 0,#103763 50%,#0A2240 100%);transition:transform .6s cubic-bezier(.6,0,.8,.3),opacity .6s}
.sp-in{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%}
.sp-logo{width:min(52vw,210px);aspect-ratio:1;border-radius:50%;object-fit:cover;border:3px solid #D9B970;box-shadow:0 0 0 8px rgba(217,185,112,.1),0 14px 44px rgba(0,0,0,.35);animation:spIn .7s ease-out both;transition:transform .45s ease-out}
.sp-name{margin-top:24px;font-size:23px;font-weight:700;animation:spIn .7s .12s ease-out both}
.sp-line{width:54px;height:2px;margin:15px 0 38px;background:#D9B970;animation:spIn .7s .2s ease-out both}
#enter{width:min(100%,310px);height:62px;border-radius:31px;text-align:center;font-size:19px;font-weight:800;letter-spacing:2.4px;color:#0A2747;background:linear-gradient(135deg,#F3DFA8,#CDA85F 55%,#EFD79C);box-shadow:0 8px 24px rgba(0,0,0,.3);animation:spIn .7s .3s ease-out both,spGlow 2.6s 1.1s ease-in-out infinite;transition:transform .12s}
#enter:active{transform:scale(.97)}
#splash.go .sp-logo{transform:scale(1.1)}
#splash.go #enter{animation:none;background:#fff}
#splash.out{transform:translateY(-100%);opacity:.5;pointer-events:none}
@keyframes spIn{from{opacity:0;transform:translateY(14px)}}
@keyframes spGlow{50%{box-shadow:0 8px 24px rgba(0,0,0,.3),0 0 0 9px rgba(217,185,112,.16)}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}#splash.out{transform:none;opacity:0}}
</style>
</head>
<body>
<div id="splash"><div class="sp-in"><img class="sp-logo" src="logo.png" alt=""><p class="sp-name">ישראל מיזוג אוויר</p><div class="sp-line"></div><button id="enter" data-a="enter" lang="en" dir="ltr">TIME IS MONEY</button></div></div>
<div id="app"></div>
<div id="sheets"></div>
<input id="filePhoto" type="file" accept="image/*" multiple hidden>
<input id="fileBackup" type="file" hidden>
<script>
'use strict';
const APP_VERSION='1.0.0', BIZ='ישראל מיזוג אוויר';
const JOB_TYPES=['התקנה','תיקון','ניקוי ושירות','מילוי גז','החלפת חלק','פירוק','בדיקה','אחר'];
const PAY_METHODS=['מזומן','ביט / פייבוקס','העברה בנקאית','צ׳ק','אשראי'];
const GAS=['','R32','R410A','R22','R407C','R134a','אחר'];
const DEFAULT_KIT=['סט מפתחות וכלי עבודה','מד לחצים (מניפולד)','מד מתח / רב-מודד','משאבת ואקום','מקדחה וביטים','סרט בידוד ואזיקונים'];

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n)=>{const d=parse(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
/* next working day: Saturday is skipped */
const nextWork=()=>{const n=addDays(today(),1);return parse(n).getDay()===6?addDays(n,1):n};
const DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const dayName=s=>'יום '+DAYS[parse(s).getDay()];
const shortDate=s=>{const d=parse(s);return d.getDate()+'.'+(d.getMonth()+1)};
const fullDate=s=>{if(!s)return'';const d=parse(s);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()};
const relDay=s=>{const n=diffDays(s,today());return n===0?'היום':n===1?'מחר':n===-1?'אתמול':dayName(s)+' '+shortDate(s)};
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/[,\s₪]/g,''));return isFinite(n)?Math.round(n*100)/100:0};
const money=n=>'<bdi class="num">₪'+(Math.round(n*100)/100).toLocaleString('en-US')+'</bdi>';
const moneyT=n=>'₪'+(Math.round(n*100)/100).toLocaleString('en-US');
const waNum=p=>{let d=String(p||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0'))d='972'+d.slice(1);return d.length>=11?d:''};
const waUrl=(p,t)=>'https://wa.me/'+waNum(p)+'?text='+encodeURIComponent(t);
const wazeUrl=a=>'https://waze.com/ul?q='+encodeURIComponent(a)+'&navigate=yes';

const P={
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',users:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6.5 7-6.5s7 2.5 7 6.5M16 4.5a4 4 0 0 1 0 7M18 15c2.500.8 4 3 4 6"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',cash:'<rect x="2" y="6" width="20" height="13" rx="2.500"/><circle cx="12" cy="12.500" r="3"/><path d="M6 10v5M18 10v5"/>',
 snow:'<path d="M12 2v20M3.300 7l17.400 10M20.700 7 3.300 17M12 6 9.500 3.500M12 6l2.500-2.500M12 18l-2.500 2.500M12 18l2.500 2.500"/>',note:'<path d="M5 3h14a1 1 0 0 1 1 1v11l-6 6H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 21v-6h6M8 8h8M8 12h5"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.400 15a1.700 1.700 0 0 0 .3 1.800l.1.100a2 2 0 1 1-2.800 2.800l-.1-.1a1.700 1.700 0 0 0-2.800 1.200V21a2 2 0 0 1-4 0v-.1a1.700 1.700 0 0 0-2.900-1.200l-.1.100a2 2 0 1 1-2.800-2.800l.1-.1a1.700 1.700 0 0 0-1.200-2.900H3a2 2 0 0 1 0-4h.1a1.700 1.700 0 0 0 1.200-2.900l-.1-.1a2 2 0 1 1 2.800-2.800l.1.100a1.700 1.700 0 0 0 1.900.3 1.700 1.700 0 0 0 1-1.500V3a2 2 0 0 1 4 0v.1a1.700 1.700 0 0 0 2.900 1.200l.1-.1a2 2 0 1 1 2.800 2.800l-.1.100a1.700 1.700 0 0 0 1.200 2.900h.1a2 2 0 0 1 0 4h-.1a1.700 1.700 0 0 0-1.500 1Z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',back:'<path d="m9 5 7 7-7 7"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',edit:'<path d="M4 20h4L19 9a2.800 2.800 0 0 0-4-4L4 16v4Z"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6"/>',
 phone:'<path d="M5 3h4l2 5-2.500 1.500a12 12 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2Z"/>',chat:'<path d="M12 3a9 9 0 0 0-7.700 13.600L3 21l4.500-1.200A9 9 0 1 0 12 3Z"/>',pin:'<path d="M12 22s7-6.500 7-12a7 7 0 1 0-14 0c0 5.500 7 12 7 12Z"/><circle cx="12" cy="10" r="2.500"/>',

const DB_NAME='israel-ac',LS_KEY='israel-ac-state';
let db=null;
const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('photos')};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=(store,mode,fn)=>new Promise((res,rej)=>{const t=db.transaction(store,mode),s=t.objectStore(store);let out;const q=fn(s);
  if(q)q.onsuccess=()=>{out=q.result};t.oncomplete=()=>res(out);t.onerror=t.onabort=()=>rej(t.error)});
const blank=()=>({v:1,clients:[],jobs:[],notes:[],materials:[],kit:DEFAULT_KIT.map(text=>({id:uid(),text})),kitDone:{},photos:[],lastBackup:null,sound:true});
let S=blank(),saveTimer=null;
function writeNow(){clearTimeout(saveTimer);saveTimer=null;const copy=JSON.stringify(S);
  try{localStorage.setItem(LS_KEY,copy)}catch(e){}
  if(db)return tx('kv','readwrite',s=>s.put(copy,'state')).catch(()=>toast('שגיאה בשמירה'))}
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(writeNow,120)}
const flush=()=>{if(saveTimer)writeNow()};
async function load(){
  try{db=await openDB();const raw=await tx('kv','readonly',s=>s.get('state'));if(raw)return Object.assign(blank(),JSON.parse(raw))}catch(e){console.warn(e)}
  try{const raw=localStorage.getItem(LS_KEY);if(raw)return Object.assign(blank(),JSON.parse(raw))}catch(e){}
  return blank();
}

const SOUNDS={tap:[[2800,0,.07]],ok:[[2800,0,.06],[2800,.1,.06]],low:[[1700,0,.13]],power:[[2200,0,.09],[2800,.12,.09],[3400,.24,.22]]};
let actx=null;
function play(kind){if(S.sound===false)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;actx=actx||new C();const c=actx,
    run=()=>{const t0=c.currentTime+.005;SOUNDS[kind].forEach(([f,at,len])=>{const o=c.createOscillator(),g=c.createGain(),t=t0+at;o.type='square';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+.004);g.gain.setValueAtTime(.05,t+len-.012);g.gain.linearRampToValueAtTime(0,t+len);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+len+.01)})};
    if(c.state==='running')run();else c.resume().then(run).catch(()=>{})}catch(e){}}
document.addEventListener('click',e=>{if(e.target.tagName==='INPUT')return;const el=e.target.closest('button,a,.pills label');if(!el||el.id==='enter')return;
  play(el.matches('.btn.bad')?'low':el.matches('.btn.pri,.btn.ok')?'ok':'tap')},true);

/* ---------- domain ---------- */
const client=id=>S.clients.find(c=>c.id===id);
const job=id=>S.jobs.find(j=>j.id===id);
const paid=j=>(j.payments||[]).reduce((a,p)=>a+p.amount,0);
const remaining=j=>j.price>0?Math.max(0,Math.round((j.price-paid(j))*100)/100):0;
const debt=j=>j.status==='done'?remaining(j):0;
const clientJobs=id=>S.jobs.filter(j=>j.clientId===id).sort((a,b)=>(b.date+(b.time||'')).localeCompare(a.date+(a.time||'')));
const clientDebt=id=>S.jobs.reduce((a,j)=>a+(j.clientId===id?debt(j):0),0);
const totalDebt=()=>S.jobs.reduce((a,j)=>a+debt(j),0);
const scheduledOn=d=>S.jobs.filter(j=>j.status!=='done'&&j.date===d).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
const openMaterials=d=>S.materials.filter(m=>m.date===d&&!m.done).length+S.kit.filter(k=>!(S.kitDone[d]||{})[k.id]).length;
function rollover(){ /* yesterday's unchecked items move on by themselves; checked ones are cleared */
  const t=today();let ch=false;
  S.materials=S.materials.filter(m=>{if(m.date>=t)return true;ch=true;if(m.done)return false;m.date=t;m.carried=true;return true});
  Object.keys(S.kitDone).forEach(k=>{if(k<t){delete S.kitDone[k];ch=true}});
  if(ch)save();
}
function syncJobMaterials(j,lines){
  const want=[...new Set(lines.map(s=>s.trim()).filter(Boolean))],day=j.date<today()?today():j.date;
  S.materials=S.materials.filter(m=>m.jobId!==j.id||m.done||(j.status!=='done'&&want.includes(m.text)));
  if(j.status==='done')return;
  S.materials.forEach(m=>{if(m.jobId===j.id&&!m.done)m.date=day});
  want.forEach(text=>{if(!S.materials.some(m=>m.jobId===j.id&&m.text===text))S.materials.push({id:uid(),text,date:day,done:false,jobId:j.id})});
}
function applyPayment(jobs,amount,method,date){
  let left=amount;
  [...jobs].sort((a,b)=>a.date.localeCompare(b.date)).forEach((j,i,arr)=>{
    if(left<=0)return;const room=remaining(j),take=(i===arr.length-1&&!j.price)?left:Math.min(left,room);
    if(take>0){(j.payments=j.payments||[]).push({id:uid(),amount:Math.round(take*100)/100,method,date});left=Math.round((left-take)*100)/100}
  });
}

function openSheet(fn,opt={}){const el=document.createElement('div');el.className='sheet '+(opt.cls||'');el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');
  const sh={fn,form:!!opt.form,el,onClose:opt.onClose};sheets.push(sh);el.innerHTML=fn();$('#sheets').append(el);document.body.classList.add('lock');hydrate(el);return sh}
function closeSheet(){const sh=sheets.pop();if(!sh)return;sh.el.remove();if(sh.onClose)sh.onClose();if(!sheets.length)document.body.classList.remove('lock');refresh()}

const urls=new Map();
async function photoURL(id){if(urls.has(id))return urls.get(id);const r=await tx('photos','readonly',s=>s.get(id));if(!r)return'';const u=URL.createObjectURL(new Blob([r.data],{type:r.type}));urls.set(id,u);return u}
function hydrate(root){root.querySelectorAll('img[data-pid]').forEach(i=>photoURL(i.dataset.pid).then(u=>{if(u)i.src=u}).catch(()=>{}))}
async function compress(file){const u=URL.createObjectURL(file);try{const im=new Image();im.src=u;await im.decode();
  const k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.78));if(!b)throw 0;return b}finally{URL.revokeObjectURL(u)}}
async function addPhotos(files){const t=ui.photoTarget;if(!t||!db)return toast('לא ניתן לשמור תמונות');let ok=0;toast('שומר תמונות…');
  for(const f of files){try{const b=await compress(f),data=await b.arrayBuffer(),id=uid();await tx('photos','readwrite',s=>s.put({type:b.type,data},id));S.photos.push({id,clientId:t.clientId,jobId:t.jobId||null,at:Date.now()});ok++}catch(e){console.warn(e)}}
  toast(ok===files.length?(ok===1?'התמונה נשמרה':ok+' תמונות נשמרו'):'חלק מהתמונות לא נשמרו');commit()}
async function removePhotos(ids){for(const id of ids){await tx('photos','readwrite',s=>s.delete(id)).catch(()=>{});if(urls.has(id)){URL.revokeObjectURL(urls.get(id));urls.delete(id)}}S.photos=S.photos.filter(p=>!ids.includes(p.id))}

  <div class="sec"><div class="row"><h2>גיבוי</h2></div><p class="small muted" style="margin-bottom:10px">כל הנתונים שמורים רק בטלפון הזה. מחיקת האפליקציה מוחקת אותם, לכן כדאי לשמור קובץ גיבוי ב-iCloud או לשלוח אותו לעצמך.</p>
  ${ui.backup?`<button class="btn ok full" data-a="backupShare">${ic('share',19)}שמירת קובץ הגיבוי</button>`:`<button class="btn pri full" data-a="backupMake">הכנת גיבוי</button>`}<button class="btn full" style="margin-top:8px" data-a="backupPick">שחזור מקובץ גיבוי</button></div></div></div>`}
async function makeBackup(){toast('מכין גיבוי…');const recs=[];for(const p of S.photos){const r=await tx('photos','readonly',s=>s.get(p.id));if(r)recs.push({id:p.id,type:r.type,data:r.data})}
  const head=new TextEncoder().encode(JSON.stringify({app:'israel-ac',v:1,at:new Date().toISOString(),state:S,photos:recs.map(r=>({id:r.id,type:r.type,size:r.data.byteLength}))})),magic='IAC1'+String(head.length).padStart(12,'0');
  const name='גיבוי-ישראל-מיזוג-'+today()+'.bin';ui.backup=new File([magic,head,...recs.map(r=>r.data)],name,{type:'application/octet-stream'});refresh()}
async function shareBackup(){const f=ui.backup;if(!f)return;let ok=false;
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'גיבוי '+BIZ});ok=true}}catch(e){if(e.name==='AbortError')return}
  if(!ok){const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),6e4)}
  S.lastBackup=new Date().toISOString();ui.backup=null;toast('הגיבוי מוכן');commit()}
async function restore(f){try{const magic=await f.slice(0,16).text();if(!/^IAC1\d{12}$/.test(magic))throw 0;const n=+magic.slice(4),h=JSON.parse(await f.slice(16,16+n).text());if(h.app!=='israel-ac'||!h.state)throw 0;
    const total=h.photos.reduce((a,p)=>a+p.size,16+n);if(total!==f.size)throw 0;
    if(!await ask(`לשחזר גיבוי מ-${fullDate(iso(new Date(h.at)))}? הנתונים הנוכחיים יוחלפו.`,'שחזור',true))return;
    toast('משחזר…');await tx('photos','readwrite',s=>s.clear());urls.forEach(u=>URL.revokeObjectURL(u));urls.clear();let pos=16+n;
    for(const p of h.photos){const data=await f.slice(pos,pos+p.size).arrayBuffer();pos+=p.size;await tx('photos','readwrite',s=>s.put({type:p.type,data},p.id))}
    S=Object.assign(blank(),h.state);ui.backup=null;await writeNow();toast('השחזור הושלם');refresh()
  }catch(e){console.warn(e);toast('הקובץ לא תקין')}}

 backupMake:()=>makeBackup().catch(()=>toast('הגיבוי נכשל')),backupShare:()=>shareBackup(),backupPick(){$('#fileBackup').click()}

const F={
 client(v,d){const name=v.name.trim();if(!name)return toast('צריך שם לקוח');const data={name,phone:v.phone.trim(),address:v.address.trim(),notes:v.notes.trim()};let id=d.id;
  if(id)Object.assign(client(id),data);else{id=uid();S.clients.push(Object.assign({id,units:[],at:Date.now()},data))}closeSheet();if(!d.id){const s=openSheet(clientSheet(id));s.clientId=id}commit()},
 job(v,d){let cid=v.clientId;if(!cid){const name=(v.clientName||'').trim();if(!name)return toast('צריך לבחור לקוח');let c=S.clients.find(x=>x.name.trim()===name);if(!c){c={id:uid(),name,phone:'',address:'',notes:'',units:[],at:Date.now()};S.clients.push(c)}cid=c.id}
  if(!v.date)return toast('צריך תאריך');const data={clientId:cid,type:v.type,status:v.status,date:v.date,time:v.time,desc:v.desc.trim(),price:num(v.price),notes:v.notes.trim()};let j=d.id&&job(d.id);
  if(j)Object.assign(j,data);else{j=Object.assign({id:uid(),payments:[]},data);S.jobs.push(j);const p=num(v.paidNow);if(p>0)j.payments.push({id:uid(),amount:p,method:v.method,date:today()})}
  syncJobMaterials(j,v.materials.split('\n'));if(d.bump)client(cid).nextService=addMonths(today(),12);closeSheet();commit();toast('העבודה נשמרה')},
 pay(v,d){const a=num(v.amount),cap=+d.cap;if(a<=0)return toast('צריך סכום');if(cap&&a>cap+.001)return toast('הסכום גדול מהיתרה');const js=d.job?[job(d.job)]:S.jobs.filter(j=>j.clientId===d.client&&debt(j)>0);applyPayment(js,a,v.method,v.date);closeSheet();commit();toast('התשלום נרשם')},
